# Local preview: docker compose up  ->  http://localhost:4000
services:
  jekyll:
    image: ruby:3.3
    working_dir: /srv/jekyll
    environment:
      BUNDLE_PATH: /usr/local/bundle
    command: >
      sh -c "bundle install &&
             bundle exec jekyll serve --livereload --host 0.0.0.0 --force_polling"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - bundle:/usr/local/bundle
volumes:
  bundle:
