# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Mario's personal blog"
email:
description: >- # this means to ignore newlines until "baseurl:"
  In this blog you will find topics of interest to computer and network performance, 
  software development especially on Java and stuff related to other interest of mine 
  such as VOIP, open source project, network protocols, strategic business planning, 
  photography etc.
twitter_username: mfj
github_username: marioja
minimal_mistakes_skin: mario
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: America/New_York # EST/EDT

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # not part of the site: importer script and its pnpm node_modules, dev tooling
  - scripts/
  - docker-compose.yml
  - CLAUDE.md
  # tool-managed folders (Jekyll skips dot-folders anyway; this also keeps the watcher out)
  - .claude/
  - .claude-flow/
  - .swarm/
  - .ruv-swarm/
  - .agents/
  - _test_posts/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Mario Jauvin"
  avatar : "/assets/images/IMG_3198-square.jpg"
  bio    : "My awesome biography constrained to a sentence or two goes here."
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://www.mfjassociates.net"
    - label: "X"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://x.com/mfj"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/marioja"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/mario_jauvin"

footer:
  links:
    - label: "X"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://x.com/mfj"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/marioja"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/mario_jauvin"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
